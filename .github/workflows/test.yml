name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.27', 'stable']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # Both matrix entries are now >= 1.27 (the floor for generic methods),
      # so enumcheck no longer needs to be gated to the stable job.
      - name: Vet enumcheck module
        run: go vet ./...
        working-directory: enumcheck

      - name: Test enumcheck module
        run: go test ./...
        working-directory: enumcheck
